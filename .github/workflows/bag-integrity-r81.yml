name: Bag integrity R81 (isolated)
on:
  push:
    branches:
      - feature/bag-integrity-r81-20261115
  workflow_dispatch:
jobs:
  bag-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund
      - name: Check syntax of changed files
        run: |
          node --check server/sim.js
          node --check server/server.js
          node --check tools/bag-integrity-test.js
      - name: Verify shared world is unchanged
        run: |
          node tools/extract-shared.js
          git diff --exit-code -- shared/world.js
      - name: Bag, shop and SQLite regression
        run: node tools/bag-integrity-test.js
      - name: Guardian and enhancement migration regression
        run: node tools/equipment-r78-migration-test.js
      - name: Existing class weapon regression
        run: node tools/equipment-class-logic-test.js
      - name: Existing simulation regression
        run: node tools/sim-test.js
      - name: Existing WebSocket combat and persistence regression
        run: node tools/combat-persistence-isolated-test.js
      - name: Install Playwright for emulated mobile UI checks
        run: |
          npm install --no-save --no-package-lock --prefix /tmp/hl-bag-browser playwright@1.56.1
          node /tmp/hl-bag-browser/node_modules/playwright/cli.js install --with-deps chromium webkit
          echo "NODE_PATH=/tmp/hl-bag-browser/node_modules" >> "$GITHUB_ENV"
      - name: Android Chromium bag UI and shield
        run: node tools/equipment-mobile-test.js
        env:
          MOBILE_BROWSER: chromium
      - name: iPhone WebKit bag UI and shield
        run: node tools/equipment-mobile-test.js
        env:
          MOBILE_BROWSER: webkit
      - name: Two browser sessions with equipment swap
        run: node tools/equipment-gameplay-test.js
      - name: Upload bag UI screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bag-r81-mobile-screenshots
          path: tools/test-artifacts/*.png
          if-no-files-found: ignore
