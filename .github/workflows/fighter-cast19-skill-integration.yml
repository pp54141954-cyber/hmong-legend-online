name: Fighter Cast19 real skill integration (staging fixture)
on:
  push:
    branches: [test/fighter-cast19-nine-real-skills]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cast19-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and the owner's original 19-frame order
        run: |
          node --check game/fighter-cast19-game-hook.js
          node --check server/server.js
          node --check tools/fighter-cast19-hook-test.js
          node --check tools/fighter-cast19-real-skill-test.js
          node tools/fighter-cast19-hook-test.js
      - name: Install backend dependencies
        run: npm ci --prefix server --no-audit --no-fund
      - name: Install mobile browser test runners
        run: |
          npm install --no-save --no-package-lock --prefix /tmp/cast19-playwright playwright@1.56.1
          node /tmp/cast19-playwright/node_modules/playwright/cli.js install --with-deps chromium webkit
          echo "NODE_PATH=/tmp/cast19-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Create temporary synthetic 1752x1280 WebP fixture for CI only
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          src=Image.open('game/sprites/pca_fighter_m.webp').convert('RGBA')
          dest=Image.new('RGBA',(1752,1280),(0,0,0,0))
          # DO NOT ship this placeholder! It only exercises the canvas/asset
          # loading paths and is not the 19-frame owner-approved animation.
          for r in range(4):
              for c in range(6):
                  cell=src.crop((min(c,4)*240,r*124,min(c,4)*240+240,r*124+124))
                  cell.thumbnail((245,210))
                  dest.alpha_composite(cell,(c*292+24,r*320+50))
          dest.save('game/sprites/fighter_cast19_user.webp',format='WEBP',lossless=True)
          print('SYNTHETIC_TEST_FIXTURE_ONLY',dest.size)
          PY
          test -f game/sprites/fighter_cast19_user.webp
          git status --short | grep -F 'game/sprites/fighter_cast19_user.webp' || true
      - name: Real nine game skills with Chromium / Pixel 7 emulation
        env:
          CAST19_BROWSER: chromium
        run: node tools/fighter-cast19-real-skill-test.js
      - name: Real nine game skills with WebKit / iPhone 13 emulation
        if: ${{ always() }}
        env:
          CAST19_BROWSER: webkit
        run: node tools/fighter-cast19-real-skill-test.js
      - name: Export CI evidence - synthetic fixture screenshots only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fighter-cast19-nine-skill-synthetic-evidence
          path: tools/test-artifacts/cast19-*.png
          if-no-files-found: ignore
