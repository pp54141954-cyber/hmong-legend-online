name: Equipment slots regression (isolated)
on:
  push:
    branches: [feature/equipment-slots-v2-safe]
  workflow_dispatch:
jobs:
  equipment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies from existing lockfile
        run: npm ci --prefix server --no-audit --no-fund
      - name: Install browser test runner without modifying game dependencies
        run: npm install --no-save --no-package-lock --prefix /tmp/hl-browser-test playwright@1.56.1
      - name: Install Chromium
        run: |
          ls -la /tmp/hl-browser-test/node_modules/playwright/cli.js
          node /tmp/hl-browser-test/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Make Playwright available to tests
        run: echo "NODE_PATH=/tmp/hl-browser-test/node_modules" >> "$GITHUB_ENV"
      - name: Guardian equipment logic
        run: node tools/equipment-slots-test.js
      - name: Existing class weapon logic regression (server)
        run: node tools/equipment-class-logic-test.js
      - name: Android Chrome mobile bag sizing and rendering
        if: ${{ always() }}
        run: node tools/equipment-mobile-test.js
        env:
          MOBILE_BROWSER: chromium
      - name: iPhone Safari WebKit mobile bag sizing and rendering
        if: ${{ always() }}
        run: node tools/equipment-mobile-test.js
        env:
          MOBILE_BROWSER: webkit
      - name: Upload mobile inventory screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: inventory-mobile-browser-previews
          path: tools/test-artifacts/*.png
          if-no-files-found: ignore
