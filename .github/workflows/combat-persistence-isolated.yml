name: Combat and persistence isolated integration
on:
  push:
    branches: [test/combat-save-20261115]
  workflow_dispatch:
jobs:
  combat-and-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies from existing lockfile
        run: npm ci --prefix server --no-audit --no-fund
      - name: Check integration test syntax
        run: node --check tools/combat-persistence-isolated-test.js
      - name: Verify WebSocket combat damage and SQLite persistence after restart
        run: node tools/combat-persistence-isolated-test.js
